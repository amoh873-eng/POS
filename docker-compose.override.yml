# Local dev override — loaded automatically on dev machines, ignored on prod
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # Development defaults — override JWT_KEY/POSTGRES_PASSWORD via .env if needed
      Jwt__Key: "DEV_ONLY_NOT_FOR_PRODUCTION_32+_CHANGE_ME_LOCAL_DEV_KEY_1234567890"
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB:-poscloud};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
    # Relaxed CORS is configured via appsettings.Development.json (Cors:AllowedOrigins)
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pos.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    depends_on: [postgres]

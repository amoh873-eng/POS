# Local dev override — loaded automatically on dev machines, never used for the
# isolated Production POS stack (prod uses docker-compose.yml + .env only).
services:
  pos-api:
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      # Development-only defaults — production secrets come from .env
      Jwt__Key: "DEV_ONLY_NOT_FOR_PRODUCTION_32+_CHANGE_ME_LOCAL_DEV_KEY_1234567890"
      AllowedHosts: "*"
      UseInMemory: "false"
      ConnectionStrings__Default: "Host=pos-db;Database=${POS_POSTGRES_DB:-POSCloudDb};Username=${POS_POSTGRES_USER:-poscloud};Password=${POS_POSTGRES_PASSWORD:-postgres}"
    volumes:
      - pos-uploads:/app/uploads
  pgadmin:
    image: dpage/pgadmin4
    container_name: pos-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pos.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    networks: [pos-net]
    depends_on: [pos-db]

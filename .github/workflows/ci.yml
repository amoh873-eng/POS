name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: poscloud, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build -c Release
      - run: dotnet test --no-build -c Release
      - name: Verify Production fail-fast (P0-1 + P1-1)
        run: |
          ASPNETCORE_ENVIRONMENT=Production dotnet run --project backend/src/PosCloud.Api --no-build -c Release &
          pid=$!; sleep 5; if ps -p $pid > /dev/null; then echo "ERROR: Production should have failed without Jwt:Key/ConnectionStrings" >&2; kill $pid; exit 1; fi; echo "Production fail-fast verified"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd frontend && flutter pub get && flutter analyze && flutter test --dart-define=API_BASE_URL=https://api.example.test

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>POS Cloud</title><style>*{box-sizing:border-box;font-family:Segoe UI,Tahoma}body{margin:0;background:#F4F5F9;color:#1F2937}header{background:#fff;border-bottom:1px solid #E5E7EB;padding:14px 16px;display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;background:#6D5BD0;color:#fff;border-radius:10px;display:grid;place-items:center;font-weight:800}nav{padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap}nav button{border:1px solid #E5E7EB;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}nav button.active{background:#6D5BD0;color:#fff}main{padding:16px}.card{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px;margin-bottom:12px}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:800px){.row{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}th,td{border:1px solid #E5E7EB;padding:8px;text-align:right}input,select{width:100%;padding:8px;border:1px solid #C7C5F4;border-radius:8px}.btn{padding:10px 14px;border-radius:10px;border:1px solid #6D5BD0;background:#6D5BD0;color:#fff;cursor:pointer}.muted{color:#6B7280} a{color:#6D5BD0}</style></head><body>
<header><div class="logo">POS</div><div><div style="font-weight:800;color:#6D5BD0">POS Cloud</div><div class="muted">واجهة خفيفة مؤقتة</div></div><div style="margin-inline-start:auto"><a href="/swagger">Swagger</a> · <a href="/health">Health</a></div></header>
<nav><button class="active" data-tab="dash">لوحة التحكم</button><button data-tab="products">المنتجات</button><button data-tab="sales">المبيعات</button><button data-tab="branches">الفروع</button></nav>
<main>
<section id="dash"><div class="row"><div class="card"><div class="muted">صافي المبيعات</div><div id="netSales" style="font-weight:800;font-size:1.3rem">—</div></div><div class="card"><div class="muted">المبيعات</div><div id="salesCount" style="font-weight:800;font-size:1.3rem">—</div></div><div class="card"><div class="muted">المخزون</div><div id="stockInfo" style="font-weight:800;font-size:1.3rem">—</div></div></div><div class="card"><button class="btn" onclick="loadDash()">تحديث</button><p class="muted">InMemory — البيانات مؤقتة</p></div></section>
<section id="products" style="display:none"><div class="card"><h3>المنتجات</h3><button class="btn" onclick="loadProducts()">تحميل</button><table style="margin-top:10px"><thead><tr><th>SKU</th><th>الاسم</th><th>السعر</th></tr></thead><tbody id="productsBody"></tbody></table></div></section>
<section id="sales" style="display:none"><div class="card"><h3>المبيعات</h3><button class="btn" onclick="loadSales()">تحميل</button><table style="margin-top:10px"><thead><tr><th>الإيصال</th><th>الإجمالي</th><th>التاريخ</th></tr></thead><tbody id="salesBody"></tbody></table></div></section>
<section id="branches" style="display:none"><div class="card"><h3>الفروع</h3><button class="btn" onclick="loadBranches()">تحميل</button><table style="margin-top:10px"><thead><tr><th>الكود</th><th>الاسم</th><th>المعرف</th></tr></thead><tbody id="branchesBody"></tbody></table></div></section>
</main>
<script>
const TENANT='00000000-0000-0000-0000-000000000000';
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section').forEach(s=>s.style.display='none');document.getElementById(b.dataset.tab).style.display='block'}));
async function jget(p){return (await fetch(p)).json()}
async function loadDash(){const s=await jget('/api/reports/daily-sales?tenantId='+TENANT);document.getElementById('netSales').textContent=(s.data?.total??0)+' JOD';document.getElementById('salesCount').textContent=s.data?.count??0;const st=await jget('/api/inventory/stock?tenantId='+TENANT);document.getElementById('stockInfo').textContent=(st.data?.length??0)+' مادة'}
async function loadProducts(){const r=await jget('/api/products?tenantId='+TENANT+'&page=1&pageSize=20');const tb=document.getElementById('productsBody');tb.innerHTML='';(r.data||[]).forEach(p=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+(p.sku||'')+'</td><td>'+(p.nameAr||p.name_ar||'')+'</td><td>'+(p.sellPrice||p.sell_price||'')+'</td>';tb.appendChild(tr)})}
async function loadSales(){const r=await jget('/api/sales?tenantId='+TENANT+'&page=1&pageSize=20');const tb=document.getElementById('salesBody');tb.innerHTML='';(r.data||[]).forEach(s=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+(s.receiptNo||s.receipt_no||'')+'</td><td>'+(s.grandTotal||s.grand_total||'')+'</td><td>'+String(s.createdAt||s.created_at||'').slice(0,19)+'</td>';tb.appendChild(tr)})}
async function loadBranches(){const r=await jget('/api/branches?tenantId='+TENANT);const tb=document.getElementById('branchesBody');tb.innerHTML='';(r.data||[]).forEach(b=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+(b.code||'')+'</td><td>'+(b.name||'')+'</td><td style=font-size:.75rem>'+(b.id||'')+'</td>';tb.appendChild(tr)})}
loadDash();
</script></body></html>

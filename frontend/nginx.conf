# POS Web nginx — SPA fallback + reverse proxy for the POS API.
# The web UI and API are exposed through a single origin; the Flutter web build
# uses Uri.base.origin (AppConfig) so it calls the same host it was served from.
# Proxy headers keep UseForwardedHeaders + AllowedHosts host filtering working.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are Base64-inflated (~1.33x); allow headroom above the 2MB API cap.
    client_max_body_size 8m;

    # API
    location /api/ {
        proxy_pass http://pos-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health
    location = /health {
        proxy_pass http://pos-api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product images (persistent volume on the API container)
    location /uploads/ {
        proxy_pass http://pos-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA fallback (serves index.html for any client route)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
# POS Cloud — isolated production Docker stack (PHASE 32)
# ======================================================
# Completely separate namespace from the existing ERP/Owner stacks:
#   network : pos-net          volumes: pos-pgdata, pos-uploads
#   dbs     : POSCloudDb       containers: pos-db / pos-api / pos-web
# It never joins erp*/owner* networks and never shares their volumes.
#
# Secrets are NOT stored here — required from .env:
#   POS_POSTGRES_PASSWORD, POS_JWT_KEY, POS_ALLOWED_HOSTS
#
# Usage:
#   cp .env.example .env   (fill secrets, pick free host ports)
#   docker compose up -d --build

name: pos-cloud

services:
  pos-db:
    image: postgres:16-alpine
    container_name: pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POS_POSTGRES_DB:-POSCloudDb}
      POSTGRES_USER: ${POS_POSTGRES_USER:-poscloud}
      POSTGRES_PASSWORD: "${POS_POSTGRES_PASSWORD:?Required: set POS_POSTGRES_PASSWORD in .env}"
    volumes:
      - pos-pgdata:/var/lib/postgresql/data
    networks: [pos-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POS_POSTGRES_USER:-poscloud} -d ${POS_POSTGRES_DB:-POSCloudDb}"]
      interval: 5s
      timeout: 3s
      retries: 12

  pos-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pos-cloud-api:${POS_VERSION:-phase32}
    container_name: pos-api
    restart: unless-stopped
    depends_on:
      pos-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=pos-db;Database=${POS_POSTGRES_DB:-POSCloudDb};Username=${POS_POSTGRES_USER:-poscloud};Password=${POS_POSTGRES_PASSWORD:?Required}"
      Jwt__Issuer: PosCloud
      Jwt__Audience: PosCloud
      Jwt__Key: "${POS_JWT_KEY:?Required: set POS_JWT_KEY (>=32 chars) in .env}"
      AllowedHosts: "${POS_ALLOWED_HOSTS:?Required: set POS_ALLOWED_HOSTS (VPS hostname/IP) in .env}"
      UseInMemory: "false"
      SeedDemoData: "false"
      Uploads__Path: /app/uploads
      Cors__AllowedOrigins__0: "${POS_WEB_ORIGIN:?Required: set POS_WEB_ORIGIN (http://host:web-port) in .env}"
    volumes:
      - pos-uploads:/app/uploads
    networks: [pos-net]
    ports:
      - "${POS_API_PORT:-8103}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 25s
      retries: 5

  pos-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pos-cloud-web:${POS_VERSION:-phase32}
    container_name: pos-web
    restart: unless-stopped
    depends_on:
      pos-api:
        condition: service_healthy
    networks: [pos-net]
    ports:
      - "${POS_WEB_PORT:-8104}:80"

networks:
  pos-net:
    name: pos-net
    driver: bridge

volumes:
  pos-pgdata:
    name: pos-pgdata
  pos-uploads:
    name: pos-uploads

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poscloud}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — copy .env.example to .env}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-poscloud}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend/src/PosCloud.Api
    ports: ["5000:8080"]
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB:-poscloud};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?required}"
      ASPNETCORE_ENVIRONMENT: "Production"
      UseInMemory: "false"
      Jwt__Key: ${JWT_KEY:?JWT_KEY required — set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      retries: 5

volumes:
  pgdata:

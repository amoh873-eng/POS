services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: poscloud
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  api:
    build: ./backend/src/PosCloud.Api
    ports: ["5000:8080"]
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=poscloud;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on: [postgres]

volumes:
  pgdata:
